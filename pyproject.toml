[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "jaynerator"
version         = "0.1.0"
description     = "Stack-aware scaffolding CLI — para hindi ka na palaging from scratch"
readme          = "README.md"
requires-python = ">=3.11"
dependencies    = [
    "colorama>=0.4.6",
    "pydantic>=2.0",
    "libcst>=1.0",
    "typer>=0.9",
]

[project.scripts]
jaynerator = "generate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["generator*", "commands*"]